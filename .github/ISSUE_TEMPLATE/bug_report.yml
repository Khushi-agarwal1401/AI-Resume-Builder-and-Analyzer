name: 🐛 Bug report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.
  - type: input
    id: url
    attributes:
      label: Page or endpoint URL
      description: Where did you see the bug?
      placeholder: https://app.example.com/...
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: A clear description of the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device, and app version if known.
      placeholder: Chrome 130 / macOS 14 / iPhone 15
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Contribution checklist
      description: Confirm you've done the basics.
      options:
        - label: I searched for an existing issue about this
          required: true
        - label: I have NOT included any secrets, tokens, or personal data in this report
          required: true
