name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-integrity:
    name: Catalog integrity (variant invariants)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-workspace.yaml uses pnpm 11 syntax (allowBuilds) — pnpm 9
          # rejects it with "packages field missing or empty".
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # HARD GATE — fails the build if the template variant catalog violates
      # its invariants (unique accent per archetype, honest ATS flags, no
      # orphan templates). These invariants underpin cross-format export
      # parity: two variants sharing an accent would collapse to identical
      # PDF/LaTeX output.
      - name: Run catalog integrity tests
        run: pnpm run test:catalog

  quality:
    name: Lint, TypeCheck, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      matrix:
        # pnpm 11 (required by pnpm-workspace.yaml's allowBuilds syntax) needs
        # Node >= 22.13, so Node 20 is no longer a supported matrix entry.
        node-version: [22]
        include:
          - node-version: 24
            experimental: true
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-workspace.yaml uses pnpm 11 syntax (allowBuilds) — pnpm 9
          # rejects it with "packages field missing or empty".
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Check Node version
        run: node -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Build
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-not-for-production' }}
          NEXTAUTH_URL: http://localhost:3000
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || '' }}

      - name: Build (no secrets — lint/typecheck/test only)
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: echo "Skipping full build — Supabase secrets not available"
