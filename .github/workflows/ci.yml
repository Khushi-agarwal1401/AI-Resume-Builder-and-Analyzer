name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-integrity:
    name: Catalog integrity (variant invariants)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # HARD GATE — fails the build if the template variant catalog violates
      # its invariants (unique accent per archetype, honest ATS flags, no
      # orphan templates). These invariants underpin cross-format export
      # parity: two variants sharing an accent would collapse to identical
      # PDF/LaTeX output.
      - name: Run catalog integrity tests
        run: npm run test:catalog

  quality:
    name: Lint, TypeCheck, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      matrix:
        node-version: [22]
        include:
          - node-version: 24
            experimental: true
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Check Node version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: DB types in sync with schema
        run: npm run db:check-types

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        if: env.DATABASE_URL != ''
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-not-for-production' }}
          NEXTAUTH_URL: http://localhost:3000
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || '' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || '' }}

      - name: Build (no secrets — lint/typecheck/test only)
        if: env.DATABASE_URL == ''
        run: echo "Skipping full build — DATABASE_URL not available"
